plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Loader-agnostic GameTest bodies live in their own source set, so they are never compiled into
// `main` and can never reach a release jar. The loaders pull these sources in through the
// `commonGametestJava` configuration and compile them into their own `gametest` source sets - the
// same trick `commonJava` plays for main, see buildSrc/src/main/groovy/multiloader-loader.gradle.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// The shared test bodies call into feature classes whose signatures mention compile-only API (a
// boss entity implements GeoEntity, for one), so the gametest source set needs the same
// compile-time view of the world as main.
configurations {
    gametestCompileOnly.extendsFrom compileOnly
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    // Put the Mojang-mapped Minecraft classes on the JUnit compile+runtime classpath so unit tests
    // can name vanilla types (ResourceLocation, Component, ItemStack, ...). Note that the game is
    // NOT bootstrapped: registries are empty and anything that touches them throws. Keep unit
    // tests to pure logic; use a GameTest when you need a live world.
    addModdingDependenciesTo(sourceSets.test)
    // GameTests are vanilla-API-only, but they still need the Minecraft classes to compile.
    addModdingDependenciesTo(sourceSets.gametest)
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: mixin_version
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: mixinextras_version
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: mixinextras_version

    // GeckoLib: the NeoForge artifact is Mojang-mapped, which is what `common` compiles against,
    // so it is the correct compile-time view of the API for loader-agnostic code.
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    commonGametestJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
    commonGametestJava sourceSets.gametest.java.sourceDirectories.singleFile
}

// Compile the GameTest bodies here too, so a break in them fails `./gradlew build` against the
// common view of the API instead of only inside whichever loader happens to build first.
tasks.named('check') {
    dependsOn tasks.named('compileGametestJava')
}
