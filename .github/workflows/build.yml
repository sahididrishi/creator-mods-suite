name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and GameTest
    runs-on: ubuntu-latest
    # The first run on a cold cache has to download and decompile Minecraft (NeoForm) and remap it
    # (Loom); afterwards the Gradle cache makes this a few minutes.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Handles the Gradle distribution download plus caching of ~/.gradle (dependencies, the
      # build cache and the Loom/NeoForm decompilation caches, which are the expensive part here).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # Builds :common, :fabric and :neoforge, runs the JUnit tests in :common and compiles the
      # gametest source sets. The GameTest *runs* are deliberately not part of `check`.
      - name: Build
        run: ./gradlew build --stacktrace

      # Both GameTest tasks boot a real dedicated server, which wants an accepted EULA in its run
      # directory. No display is involved, so nothing here needs xvfb.
      - name: Accept the EULA in the GameTest run directories
        run: |
          mkdir -p fabric/build/run/gameTest neoforge/build/run/gameTestServer
          echo "eula=true" > fabric/build/run/gameTest/eula.txt
          echo "eula=true" > neoforge/build/run/gameTestServer/eula.txt

      - name: Fabric GameTests
        run: ./gradlew :fabric:runGameTest --stacktrace

      - name: NeoForge GameTests
        run: ./gradlew :neoforge:runGameTestServer --stacktrace

      # The loader jars only. The sources and javadoc jars are produced by the same task and must
      # be filtered out, or the artifact contains three jars per loader.
      - name: Upload the Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: creatormods-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Upload the NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: creatormods-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Upload the test and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            common/build/reports/tests/**
            common/build/test-results/**
            fabric/build/junit.xml
            fabric/build/run/gameTest/logs/**
            neoforge/build/run/gameTestServer/logs/**
          if-no-files-found: ignore
          retention-days: 7
