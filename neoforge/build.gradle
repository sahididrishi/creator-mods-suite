plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Dedicated source set for GameTests so they never ship in the release jar, mirroring :fabric. The
// loader-agnostic test bodies from :common are compiled in here too - see the `commonGametestJava`
// wiring in buildSrc/src/main/groovy/multiloader-loader.gradle.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Resolve these outside the neoForge { } closures: inside them `project(...)` resolves to the
// dependency handler's project() method, not Project#project(String).
def commonGenerated = project(':common').file('src/generated/resources')
def commonResources = project(':common').file('src/main/resources')
def commonAccessTransformer = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    if (commonAccessTransformer.exists()) {
        accessTransformers.from(commonAccessTransformer.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', "${mod_id},creator_toolkit,creator_colossus,creator_powers,creator_rules,creator_evolve,creator_events,creator_arsenal,creator_vault")
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            // Every run resolves its classpath from the gametest source set, which carries main's
            // classpath plus its own output. The `mods` block below lists the gametest output
            // directory among the mod's files, and FML scans those for @GameTestHolder as soon as a
            // namespace is enabled - which the line above does for every run - so the classes have
            // to be loadable in every run, not only in gameTestServer.
            sourceSet = sourceSets.gametest
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Output lands in :common so both loaders pick the generated files up.
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', commonGenerated.absolutePath,
                    '--existing', commonResources.absolutePath
        }
        server {
            server()
        }
        // ./gradlew :neoforge:runGameTestServer
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/run/gameTestServer')
            systemProperty('neoforge.enabledGameTestNamespaces', "${mod_id},creator_toolkit,creator_colossus,creator_powers,creator_rules,creator_evolve,creator_events,creator_arsenal,creator_vault")
        }
    }
    mods {
        "${mod_id}" {
            // The gametest source set belongs to the same mod: NeoForge finds @GameTestHolder
            // classes by scanning the mod's own files, so a separate mod here would need its own
            // neoforge.mods.toml to be scanned at all. Dev-run only - `jar` still packages `main`
            // alone, which is the whole point of the split.
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Gives the GameTest stubs the mod's own classes (and, through them, :common's) to call into.
    gametestImplementation sourceSets.main.output
}
